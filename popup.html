<!doctype html><meta charset="utf-8">
<style>
body{margin:0;width:270px;padding:16px;background:#2a1b12;color:#fff;font:14px/1.4 "Google Sans",Roboto,Arial,sans-serif}
h1{margin:0 0 14px;font-size:15px;font-weight:500}
label{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
input{appearance:none;width:42px;height:24px;border-radius:12px;background:#5a4636;position:relative;cursor:pointer;transition:.15s;margin:0}
input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
input:checked{background:#4cc38a}input:checked::after{left:21px}
input:focus-visible,button:focus-visible{outline:2px solid #8ab4f8;outline-offset:2px}
button{margin-top:14px;width:100%;padding:8px;border:0;border-radius:8px;background:#4a3322;color:#fff;font:inherit;cursor:pointer}
button:hover{background:#5c4230}
</style>
<h1>Portfolio Tracker</h1>
<label>Show tracker panel<input type="checkbox" id="t" role="switch"></label>
<button id="s">Open settings</button>
<script src="popup.js"></script>
